{% extends "shop/base.html" %}

{% block content %}
<div class="container mt-4">
    <h3 class="mb-3">Validation de la commande</h3>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="row">
        <div class="col-md-6">
            <h5>Vos informations</h5>
            <form method="post" id="checkout-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="text" class="form-control" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="address">Adresse de livraison</label>
                    <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
                </div>
                <input type="hidden" name="cart" id="cart-input">
                <button type="submit" class="btn btn-success">Confirmer la commande</button>
            </form>
        </div>
        <div class="col-md-6">
            <h5>Récapitulatif du panier</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-sm bg-white">
                    <thead class="thead-light">
                        <tr>
                            <th>Produit</th>
                            <th>Quantité</th>
                        </tr>
                    </thead>
                    <tbody id="summary-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script type="text/javascript">
    function loadSummary() {
        var panier = {};
        if (localStorage.getItem('panier') != null) {
            panier = JSON.parse(localStorage.getItem('panier'));
        }
        document.getElementById('cart-input').value = JSON.stringify(panier);

        var tbody = document.getElementById('summary-body');
        tbody.innerHTML = '';
        for (var id in panier) {
            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td>Produit #' + id + '</td>' +
                '<td>' + panier[id] + '</td>';
            tbody.appendChild(tr);
        }

        if (document.getElementById("panier")) {
            document.getElementById("panier").innerHTML = "Panier (" + Object.keys(panier).length + ")";
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        loadSummary();
    });
</script>
{% endblock %}
